name: daily-pipeline

on:
  schedule:
    - cron: "0 20 * * *" # 현지(UTC+7) 새벽 03:00 = KST 05:00
  workflow_dispatch:
    inputs:
      limit:
        description: "런당 분석 상한 (건수)"
        default: "1000"
      max_cost:
        description: "런당 분석 지출 상한 (USD) — 실제 상한은 limit과 이 값 중 작은 쪽"
        default: "3"

permissions:
  contents: read

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300 # Batch 폴링 여유 (보통 1시간 내 종료)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run --workspace pipeline start -- --limit ${{ github.event.inputs.limit || '1000' }} --max-cost ${{ github.event.inputs.max_cost || '3' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 없으면 유튜브 패스를 건너뛴다 (파이프라인 본류는 영향 없음)
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

# 재인덱싱 트리거용 주석 (기능 무관)
